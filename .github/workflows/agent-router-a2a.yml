name: Cross-platform agent review with browser HAR and A2A fallback

on:
  workflow_dispatch:
  schedule:
    - cron: "35 7 * * *"
  push:
    branches:
      - release/v3.8.54
      - agent-router-a2a-20261112-05
      - agent-router-a2a-20261112-06
      - agent-router-a2a-20261113-01
    paths:
      - ".github/workflows/agent-router-a2a.yml"
      - "docs/agent-execution/current-task.md"

permissions:
  actions: write

concurrency:
  group: agent-router-a2a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent-review:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - name: Install matching Playwright package
        run: |
          node --version
          npm --version
          mkdir -p "$RUNNER_TEMP/agent-router"
          cd "$RUNNER_TEMP/agent-router"
          npm init -y >/dev/null
          npm install --no-save playwright@1.65.0

      - name: Capture browser HAR and invoke native A2A agents
        working-directory: ${{ runner.temp }}/agent-router
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs";
          import { createHash } from "node:crypto";

          const harPath = `${process.env.RUNNER_TEMP}/agent-router.har`;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            recordHar: { path: harPath, mode: "full", content: "embed" }
          });
          const page = await context.newPage();
          let pricingStatus = null;
          let pricingUrl = null;
          let pricingTitle = "";
          let pricingText = "";
          let browserMcpProbe = null;
          const deepwikiPages = [];

          try {
            const pricing = await page.goto("https://www.agent-router.org/pricing", {
              waitUntil: "domcontentloaded",
              timeout: 30000
            });
            pricingStatus = pricing?.status() ?? null;
            pricingUrl = page.url();
            pricingTitle = await page.title();
            pricingText = (await page.locator("body").innerText().catch(() => "")).slice(0, 2500);

            for (const url of [
              "https://deepwiki.com/diegosouzapw/OmniRoute",
              "https://deepwiki.com/evanbrown3000/OmniRoute-evan"
            ]) {
              try {
                const response = await page.goto(url, {
                  waitUntil: "domcontentloaded",
                  timeout: 30000
                });
                deepwikiPages.push({
                  url,
                  finalUrl: page.url(),
                  status: response?.status() ?? null,
                  title: await page.title(),
                  excerpt: (await page.locator("body").innerText().catch(() => "")).slice(0, 1800)
                });
              } catch (error) {
                deepwikiPages.push({ url, error: String(error).slice(0, 500) });
              }
            }

            await page.goto("https://agent-router.org/", {
              waitUntil: "domcontentloaded",
              timeout: 30000
            });
            try {
              browserMcpProbe = await page.evaluate(async () => {
                const rpc = async (method, params, id) => {
                  const response = await fetch("/mcp-http/mcp", {
                    method: "POST",
                    headers: {
                      "content-type": "application/json",
                      "accept": "application/json, text/event-stream"
                    },
                    body: JSON.stringify({ jsonrpc: "2.0", id, method, params }),
                    signal: AbortSignal.timeout(70000)
                  });
                  const raw = await response.text();
                  let parsed;
                  try {
                    parsed = JSON.parse(raw);
                  } catch {
                    const dataLine = raw.split("\n").find(line => line.startsWith("data:"));
                    if (dataLine) {
                      try { parsed = JSON.parse(dataLine.slice(5).trim()); } catch {}
                    }
                  }
                  return { status: response.status, raw, parsed };
                };

                const listed = await rpc("tools/list", {}, "browser-har-discovery");
                const specs = listed.parsed?.result?.tools ?? [];
                const names = specs.map(tool => tool.name);
                let discovery = null;
                if (names.includes("discover_agents")) {
                  discovery = await rpc("tools/call", {
                    name: "discover_agents",
                    arguments: {
                      query: "Find active platform agents for independent research on remote browser execution, open-source agent runtimes, and current free-tier options."
                    }
                  }, "browser-har-agent-discovery");
                }
                let a2a = null;
                if (names.includes("a2a_call_agent")) {
                  a2a = await rpc("tools/call", {
                    name: "a2a_call_agent",
                    arguments: {
                      agent_url: "https://shop.lordevo.com/a2a",
                      message: [
                        "Use only your free preflight capability to check whether a no-cost fetch of this public repository URL is available:",
                        "https://github.com/evanbrown3000/OmniRoute-evan/tree/agent-router-a2a-20261112-05",
                        "Do not invoke a paid fetch, paid site check, or any other paid skill. Do not initiate x402, request a wallet, request credentials, or submit a payment.",
                        "Return the actual preflight result, explicit task state, and context ID. A capability description alone is not task completion."
                      ].join("\n"),
                      timeout_seconds: 45
                    }
                  }, "browser-har-a2a-turn");
                }
                const a2aResult = a2a?.parsed?.result;
                const a2aText = (a2aResult?.content ?? [])
                  .filter(item => item.type === "text")
                  .map(item => item.text)
                  .join("\n") || JSON.stringify(a2aResult ?? a2a?.parsed ?? {});
                const a2aState = a2aText.match(/\bSTATE\s*[:=]\s*([A-Z_-]+)/i)?.[1]?.toUpperCase() ?? "";
                const a2aContextId = a2aText.match(/\bCONTEXT_ID\s*[:=]\s*([A-Za-z0-9._:-]+)/i)?.[1] ?? null;
                const a2aCompleted = a2a?.status === 200
                  && /^(COMPLETED|SUCCESS|SUCCEEDED|DONE)$/.test(a2aState)
                  && a2aText.trim().length > 40;
                return {
                  status: listed.status,
                  toolNames: names,
                  discoveryStatus: discovery?.status ?? null,
                  discoveryExcerpt: discovery?.raw?.slice(0, 5000) ?? null,
                  a2aAgentUrl: "https://shop.lordevo.com/a2a",
                  a2aStatus: a2a?.status ?? null,
                  a2aState,
                  a2aContextId,
                  a2aCompleted,
                  a2aText: a2aText.slice(0, 10000),
                  a2aError: a2a?.parsed?.error ?? a2aResult?.isError ?? null
                };
              });
            } catch (error) {
              browserMcpProbe = { error: String(error).slice(0, 1200) };
            }
          } finally {
            await context.close();
            await browser.close();
          }

          const har = JSON.parse(fs.readFileSync(harPath, "utf8"));
          const safeUrl = value => {
            try {
              const url = new URL(value);
              return url.origin + url.pathname;
            } catch {
              return String(value ?? "").split(/[?#]/, 1)[0];
            }
          };
          const requests = har.log.entries
            .map(entry => ({
              method: entry.request.method,
              url: safeUrl(entry.request.url),
              status: entry.response.status
            }))
            .filter(entry => /agent-router|mcp-http|a2a/i.test(entry.url))
            .slice(0, 40);
          console.log("BROWSER_HAR_EVIDENCE=" + JSON.stringify({
            pricingStatus,
            pricingUrl,
            pricingTitle,
            pricingSaysNoSignup: /no sign-up/i.test(pricingText),
            pricingExcerpt: pricingText,
            browserMcpProbe,
            deepwikiPages,
            backendRequests: requests
          }));

          const endpoint = "https://agent-router.org/mcp-http/mcp";
          const mcpTrace = [];
          const rpc = async (method, params, id, timeoutMs = 120000) => {
            const startedAt = Date.now();
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "accept": "application/json, text/event-stream"
              },
              body: JSON.stringify({ jsonrpc: "2.0", id, method, params }),
              signal: AbortSignal.timeout(timeoutMs)
            });
            const raw = await response.text();
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch {
              const dataLine = raw.split("\n").find(line => line.startsWith("data:"));
              if (dataLine) {
                try { parsed = JSON.parse(dataLine.slice(5).trim()); } catch {}
              }
            }
            const result = parsed?.result ?? parsed;
            const responseText = (result?.content ?? [])
              .filter(item => item.type === "text")
              .map(item => item.text)
              .join("\n");
            const taskId = result?.structuredContent?.task_id
              || result?.structuredContent?.taskId
              || result?.structuredContent?.task?.id
              || result?.task_id
              || result?.taskId
              || result?.task?.id
              || responseText.match(/\bTASK[_ -]?ID\s*[:=]\s*([A-Za-z0-9._:-]+)/i)?.[1]
              || params?.arguments?.task_id
              || null;
            const state = String(
              result?.structuredContent?.state
              || result?.structuredContent?.status
              || result?.state
              || result?.status
              || responseText.match(/\bSTATUS\s*[:=]\s*([A-Z_-]+)/i)?.[1]
              || ""
            ).toUpperCase();
            const contextId = responseText.match(/\bCONTEXT_ID\s*[:=]\s*([A-Za-z0-9._:-]+)/i)?.[1] ?? null;
            mcpTrace.push({
              at: new Date(startedAt).toISOString(),
              durationMs: Date.now() - startedAt,
              url: endpoint,
              jsonrpcId: id,
              method,
              toolName: params?.name ?? null,
              httpStatus: response.status,
              taskId,
              state,
              contextId,
              requestSha256: createHash("sha256").update(JSON.stringify({ method, params })).digest("hex"),
              responseSha256: createHash("sha256").update(raw).digest("hex"),
              toolNames: method === "tools/list" ? (result?.tools ?? []).map(tool => tool.name) : undefined
            });
            if (!response.ok) {
              throw new Error("MCP HTTP " + response.status + ": " +
                String(parsed?.error?.message ?? "provider endpoint rejected request").slice(0, 300));
            }
            if (parsed?.error) {
              throw new Error("MCP " + method + " error: " +
                String(parsed.error.message ?? "tool error").slice(0, 300));
            }
            return { status: response.status, parsed, raw };
          };

          const toolsResponse = await rpc("tools/list", {}, 1);
          const toolSpecs = toolsResponse.parsed?.result?.tools ?? [];
          const toolNames = toolSpecs.map(tool => tool.name);
          const taskUrl = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/${process.env.GITHUB_SHA}/docs/agent-execution/current-task.md`;
          const taskResponse = await fetch(taskUrl, { signal: AbortSignal.timeout(15000) });
          if (!taskResponse.ok) {
            throw new Error(`Unable to load the current agent task: HTTP ${taskResponse.status}`);
          }
          const currentTask = await taskResponse.text();
          const crossPlatformA2A = {
            agentUrl: browserMcpProbe?.a2aAgentUrl ?? null,
            httpStatus: browserMcpProbe?.a2aStatus ?? null,
            state: browserMcpProbe?.a2aState ?? "UNVERIFIED",
            contextId: browserMcpProbe?.a2aContextId ?? null,
            completed: browserMcpProbe?.a2aCompleted === true,
            responseSha256: browserMcpProbe?.a2aText
              ? createHash("sha256").update(browserMcpProbe.a2aText).digest("hex")
              : null
          };
          console.log("CROSS_PLATFORM_A2A_RESULT=" + JSON.stringify(crossPlatformA2A));

          const requestId = currentTask.match(/Request ID:\s*[^A-Za-z0-9]*([A-Za-z0-9._:-]+)/i)?.[1]
            ?? process.env.GITHUB_SHA;
          const selectionKey = requestId;
          const directive = key => currentTask.match(
            new RegExp("^" + key + ":\\s*([^\\s#]+)", "mi")
          )?.[1]?.trim().toLowerCase() ?? null;
          const requestedPrimary = directive("TARGET_AGENT");
          const requestedSecondary = directive("SECONDARY_AGENT");
          const primaryCandidates = [
            requestedPrimary,
            "taskplanner",
            "researchagent",
            "constructivecritic",
            "reasoningdelegationhigh",
            "softwareengineeringexpert",
            "firstprinciplesanalyst"
          ].filter((name, index, all) =>
            name && all.indexOf(name) === index && toolNames.includes(name)
          );
          const primaryName = primaryCandidates[0] ?? null;
          if (!primaryName) throw new Error("Agent Router did not advertise a supported native primary agent tool.");
          const secondaryCandidates = [
            requestedSecondary,
            "firstprinciplesanalyst",
            "researchagent",
            "reasoningdelegationhigh",
            "browsernavigationagent",
            "taskplanner",
            "constructivecritic"
          ].filter((name, index, all) =>
            name && name !== primaryName && all.indexOf(name) === index && toolNames.includes(name)
          );
          const secondaryName = secondaryCandidates[0] ?? null;
          const primaryFallbacks = primaryCandidates.slice(1).filter(name => name !== secondaryName);
          const secondaryFallbacks = secondaryCandidates.slice(1);
          const candidateNames = [...new Set([primaryName, ...primaryFallbacks, ...secondaryCandidates])];
          const selectedNames = [primaryName];
          const selectionBucket = parseInt(
            createHash("sha256").update(selectionKey).digest("hex").slice(0, 8),
            16
          ) % 100;
          const additionalAgentPrompted = selectionBucket < 36;
          if (additionalAgentPrompted && secondaryName) selectedNames.push(secondaryName);
          const selectedSpecs = toolSpecs.filter(tool => candidateNames.includes(tool.name));
          console.log("ADDITIONAL_AGENT_PROMPT=" + JSON.stringify({
            requestId,
            probability: 0.36,
            hashBucket: selectionBucket,
            selected: additionalAgentPrompted && Boolean(secondaryName),
            primary: primaryName,
            secondary: selectedNames[1] ?? null
          }));
          console.log("AGENT_TOOL_SCHEMAS=" + JSON.stringify(selectedSpecs.map(tool => ({
            name: tool.name,
            inputSchema: tool.inputSchema
          }))));

          const prompt = [
            "You are an independent software-systems architect and researcher. Review the verified OmniRoute implementation inventory below and provide a source-backed recommendation.",
            "Repository: https://github.com/evanbrown3000/OmniRoute-evan/tree/release/v3.8.54",
            "Existing implementation: provider-node API includes GET/POST /api/provider-nodes and POST /api/provider-nodes/validate; isolated Chromium/VNC/CDP provider-login sessions use management-authenticated /api/vnc-session routes, localhost-bound browser/CDP ports, up to four concurrent sessions, non-persistent profiles by default, ten-minute idle timeout and thirty-minute maximum lifetime; AgentBridge exposes IDE-agent routing and mappings; the Devin Claude-compatible agentic bridge supplies a tool-capable provider and is separate from the local ACP CLI registry; routing already includes a large provider catalog, free-tier evidence, quota-aware selection, health and failover.",
            "Verified boundaries: the shared browser-pool is an internal Playwright/Chromium pool for provider web interactions, distinct from the VNC login sessions; neither should be described as a general hosted browser provider without verifying the deployed runtime. The A2A server, ACP local CLI registry, AgentBridge, CloudAgent integrations, provider-node inference endpoints, and VNC browser sessions are separate execution surfaces.",
            "Goal: expand durable remote execution providers and browser sessions without starting from scratch. Distinguish (1) model inference endpoints, (2) native agent turns with provider-native completion evidence, and (3) browser sessions with HAR/backend endpoint evidence. Review historical implementations as well as the current branch; do not assume the newest implementation is the strongest. Recommend promoting the best proven implementation rather than layering competing systems. Preserve provider quotas, identity boundaries, and supported authentication; never bypass account verification, billing controls, or provider rate limits.",
            "Use DeepWiki at https://deepwiki.com/cheaper-inference/OmniRoute and https://deepwiki.com/evanbrown3000/OmniRoute-evan when available; cross-check its claims against current source code and public documentation.",
            "Compare current public options including Agent Router MCP/A2A, OpenWOP, OpenHands Cloud, Cloudflare Browser Run, Browserbase, Browserless and stronger free-tier alternatives. Prioritize public GitHub repositories, current official free-tier quotas, and accountless versus account-required execution.",
            "If the registry exposes a native agent on a distinct provider platform, actually dispatch one follow-on turn and wait for its provider-native completion/readback. Include platform, tool name, task ID, final status, and concise result; queued/accepted acknowledgements do not count. If unavailable, identify the exact missing capability.",
            "Recommend one long-term design and the strongest existing architecture to promote; identify minimal integration points, provider failover boundaries, durable identity/secret boundaries, and how to prove a turn actually completed rather than merely being queued.",
            "Do not modify code, create accounts, run tests, assume a free tier without current evidence, or invent successful provider executions. Include direct source URLs and concise reasoning.",
            "An adjacent private memory system exists. Do not attempt to access, quote, or disclose private repository contents. At the architecture level, preserve a clean boundary between canonical conversation/summary storage and the existing graph authority. Use the existing graph system for typed links among conversations, summaries, providers, browser sessions, HAR captures, native task IDs, and deployment evidence. Do not create a competing graph store or place operational receipts, credentials, or private metadata in public repositories.",
            "",
            "Current turn objective:\n" + currentTask,
          ].join("\n\n");

          const repoUrl = "https://github.com/evanbrown3000/OmniRoute-evan/tree/release/v3.8.54";
          const resolveSchema = (schema, root, depth = 0) => {
            if (!schema || depth > 10) return schema ?? {};
            if (schema.$ref) {
              const target = schema.$ref.replace(/^#\//, "").split("/").reduce((value, part) => {
                const key = part.replace(/~1/g, "/").replace(/~0/g, "~");
                return value?.[key];
              }, root);
              return resolveSchema(target, root, depth + 1);
            }
            if (schema.allOf?.length) {
              const merged = { ...schema, properties: { ...(schema.properties ?? {}) }, required: [...(schema.required ?? [])] };
              for (const part of schema.allOf) {
                const resolved = resolveSchema(part, root, depth + 1);
                Object.assign(merged.properties, resolved.properties ?? {});
                merged.required.push(...(resolved.required ?? []));
              }
              merged.required = [...new Set(merged.required)];
              return merged;
            }
            if (schema.oneOf?.length) return resolveSchema(schema.oneOf[0], root, depth + 1);
            if (schema.anyOf?.length) return resolveSchema(schema.anyOf[0], root, depth + 1);
            return schema;
          };

          const buildSchemaValue = (inputSchema, root, key, task, taskId = null) => {
            const schema = resolveSchema(inputSchema, root);
            const name = String(key ?? "").toLowerCase();
            if (schema.const !== undefined) return schema.const;
            if (Array.isArray(schema.enum) && schema.enum.length) return schema.enum[0];
            if (schema.type === "object" || schema.properties) {
              const properties = schema.properties ?? {};
              if (!Object.keys(properties).length) {
                return {
                  prompt: task,
                  task,
                  query: task,
                  repository_url: repoUrl,
                  repository: repoUrl
                };
              }
              const required = schema.required ?? Object.keys(properties);
              const value = {};
              for (const child of required) {
                if (properties[child]) value[child] = buildSchemaValue(properties[child], root, child, task, taskId);
              }
              return value;
            }
            if (schema.type === "array") return schema.default ?? [];
            if (schema.type === "string") {
              if (taskId && /task.*id|id.*task/.test(name)) return taskId;
              if ((/repo|repository|github|source/.test(name) && /url|uri|link/.test(name)) ||
                  ["repo", "repository", "source_url"].includes(name)) return repoUrl;
              if (/timeout|wait|seconds/.test(name)) return String(300);
              return task;
            }
            if (schema.type === "integer" || schema.type === "number") {
              if (/timeout|wait|seconds/.test(name)) return 300;
              if (/limit|count|top.?k|number|num/.test(name)) return 8;
              return schema.default ?? 5;
            }
            if (schema.type === "boolean") return schema.default ?? false;
            if (schema.default !== undefined) return schema.default;
            return task;
          };

          const buildArgs = (spec, task = prompt, taskId = null) => {
            const schema = spec.inputSchema ?? {};
            return buildSchemaValue(schema, schema, "", task, taskId);
          };

          let discovery = null;
          const discoverySpec = toolSpecs.find(item => item.name === "discover_agents");
          if (discoverySpec) {
            const discoveryArgs = buildArgs(
              discoverySpec,
              "Find active platform agents for an independent software architecture review of the OmniRoute repository, with emphasis on remote browser sessions and provider-native execution."
            );
            const discoveryResponse = await rpc(
              "tools/call",
              { name: "discover_agents", arguments: discoveryArgs },
              2
            );
            discovery = discoveryResponse.parsed?.result ?? discoveryResponse.parsed;
            console.log("AGENT_DISCOVERY_RESULT=" + JSON.stringify(discovery));
          }

          const extractText = (result) => {
            const parts = result?.content ?? [];
            return parts.filter(item => item.type === "text").map(item => item.text).join("\n")
              || JSON.stringify(result?.structuredContent ?? result ?? {});
          };

          const callAgentTool = async (name, id) => {
            const spec = selectedSpecs.find(item => item.name === name);
            if (!spec) return { name, status: "failed", error: "Agent Router did not advertise this agent tool" };
            const args = buildArgs(spec);
            const initial = await rpc("tools/call", { name, arguments: args }, id);
            let result = initial.parsed?.result ?? initial.parsed;
            let responseText = extractText(result);
            let taskId = result?.structuredContent?.task_id
              || result?.structuredContent?.taskId
              || result?.structuredContent?.task?.id
              || result?.task_id
              || result?.taskId
              || result?.task?.id
              || responseText.match(/task[_ -]?id\s*[:=]\s*([A-Za-z0-9._:-]+)/i)?.[1]
              || null;
            let waitedForTask = false;
            const readState = value => String(
              value?.structuredContent?.task?.state ??
              value?.structuredContent?.state ??
              value?.structuredContent?.status ??
              value?.task?.state ??
              value?.state ??
              value?.status ??
              ""
            ).toUpperCase();
            const readStatusLine = value => extractText(value).match(/^\s*(?:STATUS|STATE)\s*[:=]\s*([A-Z_-]+)\s*$/im)?.[1]?.toUpperCase() ?? "";
            const providerState = value => readState(value) || readStatusLine(value);
            let state = providerState(result);
            // Lifecycle classification uses provider-declared state only. Agent prose can
            // legitimately discuss pending work even after the provider task is complete.
            const pending = value => /^(RUNNING|IN_PROGRESS|QUEUED|PENDING|WAITING|INPUT_REQUIRED|STILL RUNNING)$/.test(providerState(value));
            const terminalSuccess = value => /^(COMPLETED|SUCCESS|SUCCEEDED|DONE)$/.test(providerState(value));
            const terminalFailure = value => Boolean(value?.isError)
              || /^(FAILED|ERROR|CANCELLED|TIMED_OUT)$/.test(providerState(value));
            if (taskId && !terminalSuccess(result) && !terminalFailure(result)) {
              waitedForTask = true;
              // The workflow has a 25-minute ceiling. Keep one native task alive and
              // read it back for up to 16 minutes; never launch a duplicate fallback
              // merely because the first provider has not finished yet.
              for (let poll = 0; poll < 8; poll++) {
                const waited = await rpc("tools/call", {
                  name: "wait_for_task",
                  arguments: { task_id: taskId, max_wait_seconds: 120 }
                }, id + 100 + poll, 130000);
                result = waited.parsed?.result ?? waited.parsed;
                responseText = extractText(result);
                state = providerState(result);
                const success = terminalSuccess(result);
                const failure = terminalFailure(result);
                const stillRunning = pending(result);
                console.log("TASK_WAIT_POLL=" + JSON.stringify({
                  name, taskId, poll: poll + 1, state, terminalSuccess: success,
                  terminalFailure: failure, stillRunning, responseLength: responseText.length
                }));
                if (success || failure) break;
              }
            }
            const explicitComplete = terminalSuccess(result);
            const failed = terminalFailure(result) || Boolean(initial.parsed?.isError || initial.parsed?.error);
            const isPending = !explicitComplete && !failed && pending(result);
            // A task ID makes provider-native terminal state mandatory. A long text
            // response is sufficient only for a synchronous agent tool that returned
            // no task ID; text length must never substitute for async task completion.
            const directComplete = !taskId && responseText.trim().length > 200 && !isPending && !failed;
            const isComplete = !failed && !isPending && (taskId ? explicitComplete : (explicitComplete || directComplete));
            return {
              name,
              status: isComplete ? "completed" : failed ? "failed" : "incomplete",
              httpStatus: initial.status,
              taskId: taskId ?? null,
              state: state || (isComplete ? "completed-response" : "unverified"),
              waitedForTask,
              response: responseText
            };
          };

          const resumeTasks = [...currentTask.matchAll(/^RESUME_TASK:\s*([^=\s]+)\s*=\s*([A-Za-z0-9._:-]+)/gmi)]
            .map(match => ({ name: match[1].trim(), taskId: match[2].trim() }));
          console.log("RESUME_TASKS_FOUND=" + JSON.stringify(resumeTasks));
          const resumeTask = async ({ name, taskId }, index) => {
            let state = "RUNNING";
            let responseText = "";
            let httpStatus = null;
            for (let poll = 0; poll < 8; poll++) {
              const waited = await rpc("tools/call", {
                name: "wait_for_task",
                arguments: { task_id: taskId, max_wait_seconds: 120 }
              }, 500 + index * 100 + poll, 130000);
              httpStatus = waited.status;
              const result = waited.parsed?.result ?? waited.parsed;
              responseText = extractText(result);
              const structuredState = String(
                result?.structuredContent?.task?.state
                ?? result?.structuredContent?.state
                ?? result?.structuredContent?.status
                ?? result?.task?.state
                ?? result?.state
                ?? result?.status
                ?? ""
              ).toUpperCase();
              const statusLine = responseText.match(/^\s*(?:STATUS|STATE)\s*[:=]\s*([A-Z_-]+)\s*$/im)?.[1]?.toUpperCase() ?? "";
              state = structuredState || statusLine || state;
              const stateSource = structuredState ? "structured-provider-state" : statusLine ? "provider-status-line" : "unverified";
              const success = /^(COMPLETED|SUCCESS|SUCCEEDED|DONE)$/.test(state);
              const failure = /^(FAILED|ERROR|CANCELLED|TIMED_OUT)$/.test(state);
              const pending = /^(RUNNING|IN_PROGRESS|QUEUED|PENDING|WAITING|INPUT_REQUIRED|STILL RUNNING)$/.test(state);
              console.log("TASK_RESUME_POLL=" + JSON.stringify({ name, taskId, poll: poll + 1, state, stateSource, success, failure, pending }));
              if (success) return { name, status: "completed", taskId, state, stateSource, httpStatus, response: responseText, waitedForTask: true };
              if (failure) return { name, status: "failed", taskId, state, stateSource, httpStatus, response: responseText, waitedForTask: true };
            }
            return { name, status: "incomplete", taskId, state, httpStatus, response: responseText, waitedForTask: true };
          };

          let results = [];
          const attemptedNames = new Set();
          const runCandidate = async (name, id) => {
            if (attemptedNames.has(name)) return;
            attemptedNames.add(name);
            try {
              results.push(await callAgentTool(name, id));
            } catch (error) {
              results.push({ name, status: "failed", error: String(error).slice(0, 2000) });
            }
          };
          if (resumeTasks.length) {
            results = await Promise.all(resumeTasks.map((task, index) => resumeTask(task, index)));
          } else {
            await runCandidate(primaryName, 10);
          }

          const primaryResult = () => results.find(item =>
            primaryCandidates.includes(item.name)
            && item.status === "completed"
            && item.response?.length > 80
          );
          const primaryPendingResult = () => results.find(item =>
            primaryCandidates.includes(item.name)
            && item.status === "incomplete"
            && item.taskId
          );
          let primaryExecutionName = primaryResult()?.name ?? primaryName;

          // Only a terminal primary failure permits another primary candidate.
          // A pending native task blocks fallback until that exact task is resumed.
          if (!primaryResult() && !primaryPendingResult()) {
            for (let index = 0; index < primaryFallbacks.length; index++) {
              const fallbackName = primaryFallbacks[index];
              await runCandidate(fallbackName, 30 + index);
              if (primaryResult() || primaryPendingResult()) break;
            }
          }
          primaryExecutionName = primaryResult()?.name ?? primaryExecutionName;

          const secondaryResult = () => results.find(item =>
            secondaryCandidates.includes(item.name)
            && item.name !== primaryExecutionName
            && item.status === "completed"
            && item.response?.length > 80
          );
          const secondaryPendingResult = () => results.find(item =>
            secondaryCandidates.includes(item.name)
            && item.name !== primaryExecutionName
            && item.status === "incomplete"
            && item.taskId
          );

          if (additionalAgentPrompted && primaryResult() && secondaryName) {
            // The second agent is a separate review, never a substitute for a failed primary.
            if (!secondaryResult() && !secondaryPendingResult()) {
              await runCandidate(secondaryName, 20);
            }
            if (!secondaryResult() && !secondaryPendingResult()) {
              for (let index = 0; index < secondaryFallbacks.length; index++) {
                const fallbackName = secondaryFallbacks[index];
                if (fallbackName === primaryExecutionName) continue;
                await runCandidate(fallbackName, 50 + index);
                if (secondaryResult() || secondaryPendingResult()) break;
              }
            }
          } else if (additionalAgentPrompted && primaryPendingResult()) {
            console.log("SECONDARY_AGENT_SKIPPED_UNRESOLVED_PRIMARY_TASK=" + JSON.stringify({
              name: primaryPendingResult().name,
              taskId: primaryPendingResult().taskId,
              state: primaryPendingResult().state
            }));
          }

          const primarySucceeded = Boolean(primaryResult());
          const secondarySucceeded = !additionalAgentPrompted || Boolean(secondaryResult());
          const primaryPending = Boolean(primaryPendingResult());
          const secondaryPending = Boolean(secondaryPendingResult());
          const completed = results.filter(item => item.status === "completed" && item.response?.length > 80);
          const unresolvedNativeTask = results.some(item => item.status === "incomplete" && item.taskId);
          const resumeDirectives = results
            .filter(item => item.status === "incomplete" && item.taskId)
            .map(item => "RESUME_TASK: " + item.name + " = " + item.taskId);
          if (unresolvedNativeTask) {
            console.log("NATIVE_TASK_STILL_PENDING_NO_DUPLICATE_FALLBACK=" + JSON.stringify(
              results.filter(item => item.status === "incomplete" && item.taskId)
                .map(item => ({ name: item.name, taskId: item.taskId, state: item.state }))
            ));
            console.log("RESUME_TASK_DIRECTIVES=" + JSON.stringify(resumeDirectives));
          }
          const executionFailed = (!primarySucceeded && !primaryPending)
            || (primarySucceeded && additionalAgentPrompted && !secondarySucceeded && !secondaryPending);
          const output = {
            status: executionFailed ? "failed" : unresolvedNativeTask ? "partial" : "completed",
            requestId,
            provider: "Agent Router MCP platform agents plus external A2A registry",
            primaryExecutionName,
            primarySucceeded,
            secondarySucceeded,
            results,
            crossPlatformA2A,
            secondarySelection: {
              probability: 0.36,
              hashBucket: selectionBucket,
              selected: additionalAgentPrompted,
              requestedTool: selectedNames[1] ?? null,
              completedTool: secondaryResult()?.name ?? null
            },
            resumeDirectives,
            advertisedTools: toolNames,
            discovery
          };
          console.log("NATIVE_AGENT_RESULT=" + JSON.stringify(output));
          const receipt = {
            schema: "cognilode.native-agent-turn-receipt.v1",
            requestId,
            runId: process.env.GITHUB_RUN_ID,
            commitSha: process.env.GITHUB_SHA,
            createdAt: new Date().toISOString(),
            provider: "Agent Router MCP platform agents plus external A2A registry",
            primaryExecutionName,
            primarySucceeded,
            secondarySucceeded,
            crossPlatformA2A,
            secondarySelection: output.secondarySelection,
            results: results.map(item => ({
              name: item.name,
              status: item.status,
              httpStatus: item.httpStatus ?? null,
              taskId: item.taskId ?? null,
              state: item.state ?? null,
              waitedForTask: item.waitedForTask ?? false,
              responseLength: item.response?.length ?? 0,
              responseSha256: item.response
                ? createHash("sha256").update(item.response).digest("hex")
                : null
            })),
            resumeDirectives,
            advertisedTools: toolNames
          };
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/agent-router-native-task-receipt.json",
            JSON.stringify(receipt, null, 2)
          );
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/agent-router-mcp-trace.json",
            JSON.stringify(mcpTrace, null, 2)
          );
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            "## Native cross-platform agent execution\n\n" +
            "- Primary agent: " + primaryExecutionName + " (" + (primarySucceeded ? "completed" : "not completed") + ")\n" +
            "- Independent secondary: " + (additionalAgentPrompted ? (secondaryResult()?.name ?? secondaryName ?? "unavailable") : "not selected by 36% cadence") + "\n" +
            "- Cross-platform A2A: " + (crossPlatformA2A.completed ? "completed" : "not verified") +
              " | state=" + crossPlatformA2A.state + " | context=" + (crossPlatformA2A.contextId ?? "none") + "\n\n" +
            results.map(item => "### " + item.name + "\n\n" +
              "- Status: " + (item.status ?? "failed") + "\n" +
              (item.taskId ? "- Native task ID: " + item.taskId + "\n" : "") +
              (item.response ? "\n" + item.response.slice(0, 12000) : "\n" + (item.error ?? "")) + "\n"
            ).join("\n") +
            (resumeDirectives.length
              ? "\nResume directives:\n" + resumeDirectives.join("\n") + "\n"
              : "")
          );
          if (executionFailed) {
            throw new Error("No platform-native agent reached verified terminal completion: " +
              JSON.stringify(results.map(item => ({
                name: item.name,
                status: item.status,
                taskId: item.taskId ?? null,
                state: item.state ?? null,
                error: item.error ?? null
              }))));
          }
          NODE

      - name: Sanitize browser HAR evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { createHash } from "node:crypto";

          const root = process.env.RUNNER_TEMP;
          const source = root + "/agent-router.har";
          const sourceExists = fs.existsSync(source);
          const safeUrl = value => {
            try {
              const url = new URL(value);
              return url.origin + url.pathname;
            } catch {
              return String(value ?? "").split(/[?#]/, 1)[0];
            }
          };
          const digest = value => value
            ? createHash("sha256").update(value).digest("hex")
            : null;
          const readBody = (container, field) => {
            const body = container?.[field];
            if (!body?.text) return "";
            if (body.encoding === "base64") {
              try { return Buffer.from(body.text, "base64").toString("utf8"); } catch { return ""; }
            }
            return body.text;
          };
          const parsePayload = raw => {
            if (!raw) return null;
            try { return JSON.parse(raw); } catch {
              const dataLine = raw.split("\n").find(line => line.startsWith("data:"));
              if (dataLine) {
                try { return JSON.parse(dataLine.slice(5).trim()); } catch {}
              }
              return null;
            }
          };

          const har = sourceExists ? JSON.parse(fs.readFileSync(source, "utf8")) : { log: { entries: [], pages: [] } };
          const sanitizedEntries = [];
          const indexEntries = [];
          const pages = (har.log?.pages ?? []).map(page => ({
            startedDateTime: page.startedDateTime,
            id: page.id,
            title: page.title,
            pageTimings: page.pageTimings ?? {}
          }));
          for (const entry of har.log?.entries ?? []) {
            const requestRaw = readBody(entry.request, "postData");
            const responseRaw = readBody(entry.response, "content");
            const requestPayload = parsePayload(requestRaw);
            const responsePayload = parsePayload(responseRaw);
            const result = responsePayload?.result ?? responsePayload;
            const responseText = (result?.content ?? [])
              .filter(item => item.type === "text")
              .map(item => item.text)
              .join("\n");
            const taskId = result?.structuredContent?.task_id
              || result?.structuredContent?.taskId
              || result?.structuredContent?.task?.id
              || result?.task_id
              || result?.taskId
              || result?.task?.id
              || responseText.match(/\bTASK[_ -]?ID\s*[:=]\s*([A-Za-z0-9._:-]+)/i)?.[1]
              || null;
            const state = String(
              result?.structuredContent?.state
              || result?.structuredContent?.status
              || result?.state
              || result?.status
              || responseText.match(/\bSTATUS\s*[:=]\s*([A-Z_-]+)/i)?.[1]
              || ""
            ).toUpperCase();
            const contextId = responseText.match(/\bCONTEXT_ID\s*[:=]\s*([A-Za-z0-9._:-]+)/i)?.[1] ?? null;
            const toolList = requestPayload?.method === "tools/list"
              ? (result?.tools ?? []).map(tool => ({
                  name: tool.name,
                  required: tool.inputSchema?.required ?? []
                }))
              : [];
            const mimeType = entry.response?.content?.mimeType ?? null;
            const url = safeUrl(entry.request?.url ?? "");
            indexEntries.push({
              startedDateTime: entry.startedDateTime ?? null,
              method: entry.request?.method ?? null,
              url,
              status: entry.response?.status ?? null,
              mimeType,
              durationMs: entry.time ?? null,
              jsonrpcMethod: requestPayload?.method ?? null,
              jsonrpcId: requestPayload?.id ?? null,
              toolName: requestPayload?.params?.name ?? null,
              taskId,
              state,
              contextId,
              toolList,
              requestBodySha256: digest(requestRaw),
              responseBodySha256: digest(responseRaw)
            });
            sanitizedEntries.push({
              startedDateTime: entry.startedDateTime,
              time: entry.time,
              request: {
                method: entry.request?.method ?? "GET",
                url,
                httpVersion: entry.request?.httpVersion ?? "HTTP/1.1",
                headers: [],
                queryString: [],
                cookies: [],
                headersSize: -1,
                bodySize: 0
              },
              response: {
                status: entry.response?.status ?? 0,
                statusText: entry.response?.statusText ?? "",
                httpVersion: entry.response?.httpVersion ?? "HTTP/1.1",
                headers: [],
                cookies: [],
                content: { size: 0, mimeType },
                redirectURL: entry.response?.redirectURL ? safeUrl(entry.response.redirectURL) : "",
                headersSize: -1,
                bodySize: 0
              },
              cache: {},
              timings: entry.timings ?? {}
            });
          }

          const sanitizedHar = {
            log: {
              version: "1.2",
              creator: { name: "OmniRoute sanitized evidence", version: "1" },
              pages,
              entries: sanitizedEntries
            }
          };
          const sanitizedPath = root + "/agent-router-sanitized.har";
          const indexPath = root + "/agent-router-har-index.json";
          fs.writeFileSync(sanitizedPath, JSON.stringify(sanitizedHar));
          const tracePath = root + "/agent-router-mcp-trace.json";
          const receiptPath = root + "/agent-router-native-task-receipt.json";
          const mcpTrace = fs.existsSync(tracePath)
            ? JSON.parse(fs.readFileSync(tracePath, "utf8"))
            : [];
          const receipt = fs.existsSync(receiptPath)
            ? JSON.parse(fs.readFileSync(receiptPath, "utf8"))
            : null;
          const index = {
            schema: "cognilode.sanitized-har-index.v1",
            createdAt: new Date().toISOString(),
            sourceFile: sourceExists ? "agent-router.har" : null,
            entryCount: indexEntries.length,
            entries: indexEntries,
            mcpTrace,
            nativeTaskReceipt: receipt
          };
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2));
          const sha256 = createHash("sha256")
            .update(fs.readFileSync(sanitizedPath))
            .digest("hex");
          console.log("SANITIZED_HAR_EVIDENCE=" + JSON.stringify({
            sourceExists,
            entryCount: indexEntries.length,
            sanitizedHar: "agent-router-sanitized.har",
            index: "agent-router-har-index.json",
            sha256
          }));
          NODE

      - name: Retain sanitized browser HAR and native task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-router-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent-router-sanitized.har
            ${{ runner.temp }}/agent-router-har-index.json
            ${{ runner.temp }}/agent-router-mcp-trace.json
            ${{ runner.temp }}/agent-router-native-task-receipt.json
          if-no-files-found: warn
          retention-days: 7
