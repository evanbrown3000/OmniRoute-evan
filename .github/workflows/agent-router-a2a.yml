name: One-shot cross-platform agent review

on:
  push:
    branches:
      - agent-router-a2a-20261112-01
    paths:
      - ".github/workflows/agent-router-a2a.yml"

permissions: {}

jobs:
  agent-review:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute
      options: --ipc=host
    timeout-minutes: 8
    steps:
      - name: Install matching Playwright package
        run: |
          node --version
          npm --version
          mkdir -p "$RUNNER_TEMP/agent-router"
          cd "$RUNNER_TEMP/agent-router"
          npm init -y >/dev/null
          npm install --no-save playwright@1.65.0

      - name: Capture browser HAR and invoke native A2A agents
        working-directory: ${{ runner.temp }}/agent-router
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const harPath = `${process.env.RUNNER_TEMP}/agent-router.har`;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            recordHar: { path: harPath, mode: "full", content: "embed" }
          });
          const page = await context.newPage();
          let pricingStatus = null;
          let pricingUrl = null;
          let pricingTitle = "";
          let pricingText = "";
          let browserMcpProbe = null;

          try {
            const pricing = await page.goto("https://www.agent-router.org/pricing", {
              waitUntil: "domcontentloaded",
              timeout: 30000
            });
            pricingStatus = pricing?.status() ?? null;
            pricingUrl = page.url();
            pricingTitle = await page.title();
            pricingText = (await page.locator("body").innerText().catch(() => "")).slice(0, 2500);

            await page.goto("https://agent-router.org/", {
              waitUntil: "domcontentloaded",
              timeout: 30000
            });
            browserMcpProbe = await page.evaluate(async () => {
              const response = await fetch("/mcp-http/mcp", {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "accept": "application/json, text/event-stream"
                },
                body: JSON.stringify({
                  jsonrpc: "2.0",
                  id: "browser-har-discovery",
                  method: "tools/list",
                  params: {}
                })
              });
              return {
                status: response.status,
                body: (await response.text()).slice(0, 2000)
              };
            });
          } finally {
            await context.close();
            await browser.close();
          }

          const har = JSON.parse(fs.readFileSync(harPath, "utf8"));
          const requests = har.log.entries
            .map(entry => ({
              method: entry.request.method,
              url: entry.request.url,
              status: entry.response.status
            }))
            .filter(entry => /agent-router|mcp-http|a2a/i.test(entry.url))
            .slice(0, 40);
          fs.rmSync(harPath, { force: true });

          console.log("BROWSER_HAR_EVIDENCE=" + JSON.stringify({
            pricingStatus,
            pricingUrl,
            pricingTitle,
            pricingSaysNoSignup: /no sign-up/i.test(pricingText),
            pricingExcerpt: pricingText,
            browserMcpProbe,
            backendRequests: requests
          }));

          const endpoint = "https://agent-router.org/mcp-http/mcp";
          const rpc = async (method, params, id) => {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "accept": "application/json, text/event-stream"
              },
              body: JSON.stringify({ jsonrpc: "2.0", id, method, params }),
              signal: AbortSignal.timeout(55000)
            });
            const raw = await response.text();
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch {
              const dataLine = raw.split("\n").find(line => line.startsWith("data:"));
              if (dataLine) {
                try { parsed = JSON.parse(dataLine.slice(5).trim()); } catch {}
              }
            }
            if (!response.ok) {
              throw new Error(`MCP HTTP ${response.status}: ${raw.slice(0, 1200)}`);
            }
            if (parsed?.error) {
              throw new Error(`MCP ${method} error: ${JSON.stringify(parsed.error).slice(0, 1200)}`);
            }
            return { status: response.status, parsed, raw };
          };

          const toolsResponse = await rpc("tools/list", {}, 1);
          const toolSpecs = toolsResponse.parsed?.result?.tools ?? [];
          const toolNames = toolSpecs.map(tool => tool.name);
          const selectedNames = ["softwareengineeringexpert", "researchagent"];
          const selectedSpecs = toolSpecs.filter(tool => selectedNames.includes(tool.name));
          console.log("AGENT_TOOL_SCHEMAS=" + JSON.stringify(selectedSpecs.map(tool => ({
            name: tool.name,
            inputSchema: tool.inputSchema
          }))));

          const prompt = [
            "You are an independent software-systems architect and researcher. Review the verified OmniRoute implementation inventory below and provide a source-backed recommendation.",
            "Repository: https://github.com/evanbrown3000/OmniRoute-evan/tree/release/v3.8.54",
            "Existing implementation: provider-node API includes GET/POST /api/provider-nodes and POST /api/provider-nodes/validate; isolated Chromium/VNC/CDP provider-login sessions use management-authenticated /api/vnc-session routes, localhost-bound browser/CDP ports, up to four concurrent sessions, non-persistent profiles by default, ten-minute idle timeout and thirty-minute maximum lifetime; AgentBridge exposes IDE-agent routing and mappings; a Devin ACP bridge supplies a Claude-format tool-capable provider; routing already includes a large provider catalog, free-tier evidence, quota-aware selection, health and failover.",
            "Goal: expand durable remote execution providers and browser sessions without starting from scratch. Distinguish (1) model inference endpoints, (2) native agent turns with provider-native completion evidence, and (3) browser sessions with HAR/backend endpoint evidence.",
            "Compare current public options including Agent Router MCP/A2A, OpenWOP, OpenHands Cloud, Cloudflare Browser Run, Browserbase, Browserless and any stronger free-tier alternatives you can verify.",
            "Recommend one long-term design and the strongest existing architecture to promote; identify minimal integration points, provider failover boundaries, durable identity/secret boundaries, and how to prove a turn actually completed rather than merely being queued.",
            "Do not modify code, create accounts, run tests, assume a free tier without current evidence, or invent successful provider executions. Include direct source URLs and concise reasoning."
          ].join("\n\n");

          const repoUrl = "https://github.com/evanbrown3000/OmniRoute-evan/tree/release/v3.8.54";
          const buildArgs = (spec) => {
            const properties = spec.inputSchema?.properties ?? {};
            const required = spec.inputSchema?.required ?? [];
            const args = {};
            for (const key of required) {
              const normalized = key.toLowerCase();
              const property = properties[key] ?? {};
              if (/repo|repository|github|source|url/.test(normalized)) {
                args[key] = repoUrl;
              } else if (/query|question|prompt|task|request|goal|objective|instruction|topic|problem|message|description|context|input/.test(normalized)) {
                args[key] = prompt;
              } else if (/timeout|wait/.test(normalized)) {
                args[key] = 180;
              } else if (/limit|count|top.?k|number|num/.test(normalized)) {
                args[key] = 8;
              } else if (property.type === "string") {
                args[key] = prompt;
              } else if (property.type === "integer" || property.type === "number") {
                args[key] = property.default ?? 5;
              } else if (property.type === "boolean") {
                args[key] = property.default ?? false;
              } else if (property.type === "array") {
                args[key] = property.default ?? [];
              } else if (property.type === "object") {
                args[key] = property.default ?? {};
              }
            }
            return args;
          };

          const extractText = (result) => {
            const parts = result?.content ?? [];
            return parts.filter(item => item.type === "text").map(item => item.text).join("\n")
              || JSON.stringify(result?.structuredContent ?? result ?? {});
          };

          const callAgentTool = async (name, id) => {
            const spec = selectedSpecs.find(item => item.name === name);
            if (!spec) return { name, error: "Agent Router did not advertise this agent tool" };
            const args = buildArgs(spec);
            const missing = (spec.inputSchema?.required ?? []).filter(key => !(key in args));
            if (missing.length) return { name, error: "Required input mapping missing: " + missing.join(", "), schema: spec.inputSchema };
            const initial = await rpc("tools/call", { name, arguments: args }, id);
            let result = initial.parsed?.result ?? initial.parsed;
            let responseText = extractText(result);
            const taskId = result?.structuredContent?.task_id
              || result?.task_id
              || responseText.match(/task[_ ]?id\\s*[:=]\\s*([a-f0-9-]+)/i)?.[1];
            if (taskId && /RUNNING|IN_PROGRESS/i.test(responseText)) {
              const waited = await rpc("tools/call", {
                name: "wait_for_task",
                arguments: { task_id: taskId, max_wait_seconds: 180 }
              }, id + 100);
              result = waited.parsed?.result ?? waited.parsed;
              responseText = extractText(result);
            }
            const failed = Boolean(result?.isError || initial.parsed?.isError || initial.parsed?.error)
              || /STATUS:\\s*(FAILED|ERROR)|\\bERROR\\b/i.test(responseText);
            return {
              name,
              status: failed ? "failed" : "completed",
              httpStatus: initial.status,
              taskId: taskId ?? null,
              response: responseText
            };
          };

          const results = [];
          for (let index = 0; index < selectedNames.length; index++) {
            const name = selectedNames[index];
            try {
              results.push(await callAgentTool(name, 10 + index));
            } catch (error) {
              results.push({ name, status: "failed", error: String(error).slice(0, 2000) });
            }
          }
          const completed = results.filter(item => item.status === "completed" && item.response?.length > 80);
          if (!completed.length) {
            throw new Error("No platform-native agent completed: " + JSON.stringify(results));
          }

          const output = {
            status: "completed",
            provider: "Agent Router MCP platform agents",
            results,
            advertisedTools: toolNames
          };
          console.log("NATIVE_AGENT_RESULT=" + JSON.stringify(output));
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            "## Native cross-platform agent execution\n\n" +
            results.map(item => "### " + item.name + "\n\n" +
              "- Status: " + (item.status ?? "failed") + "\n" +
              (item.taskId ? "- Native task ID: " + item.taskId + "\n" : "") +
              (item.response ? "\n" + item.response.slice(0, 12000) : "\n" + (item.error ?? "")) + "\n"
            ).join("\n")
          );
