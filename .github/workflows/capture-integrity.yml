name: Capture integrity
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-integrity:
    name: Capture integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/capture-integrity.test.mjs
