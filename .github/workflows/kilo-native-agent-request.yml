name: Kilo native peer turn

on:
  push:
    branches: [release/v3.8.54]
    paths:
      - "agent-requests/*.json"

permissions:
  contents: read

concurrency:
  group: kilo-peer-${{ github.ref }}-${{ github.event.head_commit.id }}
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve exactly one new public peer request
        id: request
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          sha = os.environ["EVENT_SHA"]
          paths = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", sha],
              text=True,
          ).splitlines()
          candidates = [
              p for p in paths
              if p.startswith("agent-requests/") and p.endswith(".json")
          ]
          if len(candidates) != 1:
              raise SystemExit(f"expected exactly one request file; found {len(candidates)}")
          path = pathlib.Path(candidates[0])
          data = json.loads(path.read_text(encoding="utf-8"))
          required = {
              "request_id", "parent_workflow_run_id", "parent_native_task_id",
              "prompt", "model", "max_tokens",
          }
          if set(data) != required:
              raise SystemExit("request schema mismatch")
          if data["request_id"] != path.stem:
              raise SystemExit("request_id must equal the request filename stem")
          if not isinstance(data["prompt"], str) or not 1 <= len(data["prompt"]) <= 12000:
              raise SystemExit("bounded public prompt required")
          if data["model"] not in {
              "nvidia/nemotron-3-ultra-550b-a55b:free",
              "cohere/north-mini-code:free",
          }:
              raise SystemExit("only explicitly supported Kilo free models are allowed")
          if type(data["max_tokens"]) is not int or not 256 <= data["max_tokens"] <= 4096:
              raise SystemExit("bounded max_tokens required")
          if not isinstance(data["parent_workflow_run_id"], str) or not data["parent_workflow_run_id"]:
              raise SystemExit("parent workflow identity required")
          if not isinstance(data["parent_native_task_id"], str) or not data["parent_native_task_id"]:
              raise SystemExit("parent native task identity required")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"path={path.as_posix()}\n")
              out.write(f"request_id={data['request_id']}\n")
          PY

      - name: Execute one Kilo provider-native turn
        env:
          REQUEST_PATH: ${{ steps.request.outputs.path }}
          EVENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/kilo-native-peer"
          python - <<'PY'
          import hashlib, json, os, pathlib, sys, time, urllib.error, urllib.request

          endpoint = "https://ai-gateway.kilo.ai/api/v1/chat/completions"
          request_path = pathlib.Path(os.environ["REQUEST_PATH"])
          request = json.loads(request_path.read_text(encoding="utf-8"))
          output_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kilo-native-peer"
          started = time.monotonic()

          body = {
              "model": request["model"],
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You are an independent senior agent-architecture reviewer. "
                          "Review the supplied public project context rigorously. Do not "
                          "claim access to private systems or files. Separate verified "
                          "facts, assumptions, and recommendations. Focus on durable "
                          "cross-platform native agent execution, provider-issued turn "
                          "identity, terminal readback, parent-child handoff lineage, "
                          "quota-aware routing, and legitimate free-tier expansion. "
                          "Do not propose duplicate schedulers, account creation to evade "
                          "limits, credential reuse, paid upgrades, or legal analysis. "
                          "Prefer upgrading the best existing implementation over "
                          "starting over or proposing isolated short-term fixes."
                      ),
                  },
                  {"role": "user", "content": request["prompt"]},
              ],
              "temperature": 0.2,
              "max_tokens": request["max_tokens"],
              "stream": False,
          }
          encoded = json.dumps(
              body, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          receipt = {
              "schema": "cognilode.kilo.native-peer-turn.v1",
              "request_id": request["request_id"],
              "parent_workflow_run_id": request["parent_workflow_run_id"],
              "parent_native_task_id": request["parent_native_task_id"],
              "workflow_run_id": os.environ["RUN_ID"],
              "workflow_run_url": os.environ["RUN_URL"],
              "commit_sha": os.environ["EVENT_SHA"],
              "provider": "kilo-ai-gateway",
              "quota_scope": "kilo.free-model.shared-provider-quota",
              "selected_model": request["model"],
              "endpoint": endpoint,
              "request_sha256": hashlib.sha256(encoded).hexdigest(),
              "automatic_retry": False,
              "provider_submission": "unknown",
              "status": "outcome_unknown",
          }

          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "OmniRoute-Kilo-Peer/1.0",
          }
          req = urllib.request.Request(endpoint, data=encoded, headers=headers, method="POST")
          raw = b""
          response_headers = {}
          http_status = None
          try:
              try:
                  response = urllib.request.urlopen(req, timeout=120)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  http_status = int(response.status)
                  response_headers = {k.lower(): v for k, v in response.headers.items()}
                  raw = response.read(100000 + 1)
              receipt["provider_submission"] = True
              receipt["http_status"] = http_status
              receipt["response_bytes"] = len(raw)
              receipt["response_sha256"] = hashlib.sha256(raw).hexdigest()
              receipt["retry_after"] = response_headers.get("retry-after")
              receipt["native_rate_limit_remaining"] = response_headers.get("x-ratelimit-remaining")
              if len(raw) > 100000:
                  receipt["status"] = "provider_response_exceeds_bound"
              elif http_status != 200:
                  receipt["status"] = "provider_rate_limited" if http_status == 429 else "provider_http_rejected"
                  receipt["error_excerpt"] = raw[:2000].decode("utf-8", "replace")
              else:
                  payload = json.loads(raw)
                  choice = payload["choices"][0]
                  message = choice["message"]
                  native_id = payload.get("id")
                  content = message.get("content")
                  finish_reason = choice.get("finish_reason")
                  receipt.update({
                      "native_request_id": native_id,
                      "served_model": payload.get("model"),
                      "finish_reason": finish_reason,
                      "usage": payload.get("usage", {}),
                  })
                  if not isinstance(native_id, str) or not native_id or not isinstance(content, str) or not content.strip() or finish_reason != "stop":
                      receipt["status"] = "native_response_not_terminal"
                  else:
                      receipt["status"] = "native_turn_completed"
                      receipt["message_content"] = content
          except Exception as error:
              receipt["status"] = "transport_outcome_unknown"
              receipt["error_type"] = type(error).__name__
              receipt["error_excerpt"] = str(error)[:1000]

          receipt["elapsed_seconds"] = round(time.monotonic() - started, 3)
          (output_dir / "receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          if receipt.get("status") == "native_turn_completed":
              (output_dir / "result.md").write_text(
                  "# Kilo native peer result\n\n"
                  f"- Request: {request['request_id']}\n"
                  f"- Parent workflow: {request['parent_workflow_run_id']}\n"
                  f"- Parent native task: {request['parent_native_task_id']}\n"
                  f"- Provider native ID: {receipt['native_request_id']}\n"
                  f"- Model: {receipt['served_model']}\n"
                  f"- Finish: {receipt['finish_reason']}\n\n"
                  + receipt["message_content"] + "\n",
                  encoding="utf-8",
              )
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(
                      "## Kilo native peer turn completed\n\n"
                      f"- Native ID: {receipt['native_request_id']}\n"
                      f"- Model: {receipt['served_model']}\n"
                      f"- Parent task: {request['parent_native_task_id']}\n"
                      "- Receipt: receipt.json\n"
                  )
          else:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(
                      "## Kilo peer turn not completed\n\n"
                      f"- Status: {receipt['status']}\n"
                      f"- HTTP: {receipt.get('http_status', 'unknown')}\n"
                      "- No automatic retry or replacement submission was made.\n"
                  )
          if receipt.get("status") != "native_turn_completed":
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kilo-native-peer-${{ github.run_id }}
          path: ${{ runner.temp }}/kilo-native-peer/
          retention-days: 30
